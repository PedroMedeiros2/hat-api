# ============================================
# HAT API - indicadores do painel hospitalar (so leitura do SPData)
#
# Senhas e enderecos NUNCA ficam aqui (este arquivo vai para o git). Vem de variaveis de ambiente
# ou, para desenvolver, de um arquivo .env na raiz do projeto (fora do git; modelo em .env.exemplo).
# ============================================
spring.application.name=hat-api
spring.config.import=optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8085}
server.error.include-message=never

# Encoding para a acentuacao sair correta
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# ============================================
# Login unico do GAW
# Toda rota exige o access token do GAW com a permissao do indicador (ver seguranca/Permissoes).
# ============================================
hat.gaw.issuer=${GAW_ISSUER:http://localhost:3000}
hat.gaw.jwks-uri=${GAW_JWKS_URI:}
hat.gaw.aplicacao=${GAW_APLICACAO:indicadores}

# ============================================
# SPData (Firebird), usuario SOMENTE LEITURA
# ============================================
spring.datasource.spdata.jdbc-url=${SGH_DB_URL}
spring.datasource.spdata.username=${SGH_DB_USER}
spring.datasource.spdata.password=${SGH_DB_PASSWORD}
spring.datasource.spdata.driver-class-name=org.firebirdsql.jdbc.FBDriver
spring.datasource.spdata.read-only=true
# Pool enxuto no SPData (como no GAW): 1 conexao sempre aberta e no maximo 5; as extras fecham
# depois de 5 min paradas e cada conexao e renovada a cada 30 min.
spring.datasource.spdata.maximum-pool-size=${SGH_DB_POOL_MAX:5}
spring.datasource.spdata.minimum-idle=${SGH_DB_POOL_MIN_IDLE:1}
spring.datasource.spdata.idle-timeout=300000
spring.datasource.spdata.max-lifetime=1800000
spring.datasource.spdata.connection-timeout=10000
# sobe mesmo com o SPData fora (a primeira consulta tenta de novo)
spring.datasource.spdata.initialization-fail-timeout=-1

spring.jpa.spdata.database-platform=org.hibernate.community.dialect.FirebirdDialect
spring.jpa.spdata.hibernate.ddl-auto=none
spring.jpa.spdata.show-sql=false
spring.jpa.open-in-view=false

# Banco proprio do painel (PostgreSQL no servidor do GAW, banco "indicadores" e usuario proprio): cadastro CNES.
# Vazio = cadastro CNES so para leitura, a partir do arquivo inicial da API.
hat.banco.url=${INDICADORES_DB_URL:}
hat.banco.usuario=${INDICADORES_DB_USER:}
hat.banco.senha=${INDICADORES_DB_PASSWORD:}
